# SPDX-License-Identifier: AGPL-3.0-or-later
# Última red: revisa todo el historial en cada push y PR. Lo principal es no subirlo
# (hooks locales y protección de push de GitHub); esto detecta lo que se haya escapado.
name: Comprobación de fugas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Ficheros prohibidos, secretos y datos personales (árbol)
        run: python scripts/check_leaks.py --tree

      - name: Ficheros prohibidos, secretos y datos personales (historial)
        run: python scripts/check_leaks.py --history

      - name: Secretos en el historial (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
